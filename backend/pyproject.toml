[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-rule-studio"
version = "0.1.0"
description = "Data Rule Studio: deterministic regulatory rule binding, sandbox validation, and audit workbench"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "pydantic-settings>=2.5,<3",
  "PyMySQL>=1.1,<2",
  "oracledb>=2.5,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "json-repair>=0.30,<1",
  "alembic>=1.14,<2",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "requests>=2.32,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "smoke: real-link smoke test requiring real GLM + Oracle (skipped unless RUN_REAL_SMOKE=1)",
]

[tool.setuptools.packages.find]
include = ["app*"]
